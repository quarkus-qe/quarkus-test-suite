# Explicitly set the database name to avoid using MySQL's system database "mysql",
# which does not enforce FK constraints. Without this, DevServices defaults to the
# datasource name ("mysql") as the database name.
quarkus.datasource.mysql.devservices.db-name=quarkus
quarkus.datasource.mysql.db-kind=mysql
quarkus.hibernate-orm.named.datasource=mysql
quarkus.hibernate-orm.named-2.datasource=mysql
quarkus.hibernate-orm.test-hql-pu.datasource=mysql
quarkus.hibernate-orm.temporal-pu.datasource=mysql
