quarkus.hibernate-orm.database.charset=utf-8
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.datasource.db-kind=postgresql

# QUARKUS-8779 - Scenario 4
quarkus.hibernate-orm.cache."io.quarkus.ts.hibernate.reactive.database.CachedDocument".memory.maximum-weight=1000
quarkus.hibernate-orm.cache."io.quarkus.ts.hibernate.reactive.database.CachedDocument".memory.weigher-class=io.quarkus.ts.hibernate.reactive.database.CachedDocumentWeigher
# far beyond any test timeout, so only the weight bound can evict from the region
quarkus.hibernate-orm.cache."io.quarkus.ts.hibernate.reactive.database.CachedDocument".expiration.max-idle=1h

# HttpClient config
io.quarkus.ts.hibernate.reactive.http.SomeApi/mp-rest/url=http://localhost:${quarkus.http.port}
