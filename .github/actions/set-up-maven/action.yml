name: 'Set Maven version'
description: 'Setting specific maven version'
runs:
  using: "composite"
  steps:
    - name: Install Maven 3.9.16
      shell: bash
      run: |
        mkdir -p $HOME/maven
        curl -fsSL https://dlcdn.apache.org/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz | tar -xz -C $HOME/maven --strip-components=1
        echo "$HOME/maven/bin" >> $GITHUB_PATH

    - name: Verify Maven Version
      shell: bash
      run: mvn -version
