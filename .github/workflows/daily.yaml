name: "Daily Build"
on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'
jobs:
  build-quarkus:
    name: Build Quarkus
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 17 ]
    steps:
      - uses: actions/checkout@v7
      - name: Reclaim Disk Space
        run: .github/ci-prerequisites.sh
      - name: Install JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          check-latest: true
      - name: Install tools
        run: sudo apt install -qq -y xsltproc yq
      - name: Initialize build environment properties
        run: |
          # Save local repo to GH ENV to ensure that it's the same in all steps
          mkdir -p maven-repository
          echo "LOCAL_REPO=$(pwd)/maven-repository" >> $GITHUB_ENV
          echo "MVN_SETTINGS=$GITHUB_WORKSPACE/.github/mvn-settings.xml" >> $GITHUB_ENV
          cat > $GITHUB_WORKSPACE/.github/config.yaml <<EOF
          ---
          core:
            branch: 3.40
            version: 3.40.999-SNAPSHOT
          platform:
            branch: 3.40
            version: 3.40.999-core-3.40-SNAPSHOT
          langchain4j:
            branch: 1.13
            version: 1.13.999-SNAPSHOT
          mcp:
            branch: 2.0.x
            version: 2.0.999-SNAPSHOT
          httpp:
            branch: 3.x
            version: 999-SNAPSHOT
          EOF
      - name: Build Quarkus Platform and its dependencies
        run: |
          
          chmod u+x $GITHUB_WORKSPACE/.github/build_whole_platform.sh

          $GITHUB_WORKSPACE/.github/build_whole_platform.sh \
          --settings ${{ env.MVN_SETTINGS }} \
          --repo ${{ env.LOCAL_REPO }} \
          --config $GITHUB_WORKSPACE/.github/config.yaml \
          --minimiser $GITHUB_WORKSPACE/.github/minimise_platform.xsl
      - name: Cache Build Outputs
        uses: actions/cache/save@v6
        with:
          # Keep same path ./action/cache-quarkus/action
          path: |
            maven-repository
          key: quarkus-daily-build-${{ github.run_id }}
  linux-build-jvm-latest:
    name: Linux JVM
    runs-on: ubuntu-latest
    needs: build-quarkus
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21, 25 ]
        profiles: [ "root-modules", "http-modules,security-modules,spring-modules", "hibernate-modules",
                   "sql-db-modules", "root-modules -pl build/podman/,build/docker -Dtest-ubi8-compatibility",
                   "messaging-modules,websockets-modules,monitoring-modules,cache-modules,test-tooling-modules,nosql-db-modules,ai-modules"]
    steps:
      - uses: actions/checkout@v7
      - name: Reclaim Disk Space
        run: .github/ci-prerequisites.sh
      - name: Install JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          check-latest: true
      - uses: ./.github/actions/cache-quarkus
      - uses: ./.github/actions/prepare-quarkus-cli
      - uses: ./.github/actions/use-docker-mirror
      - name: Install Maven settings
        run: cp .github/mvn-settings.xml ~/.m2/settings.xml
      - name: Test in JVM mode
        run: |
          mvn -fae -V -B -nsu --no-transfer-progress clean verify -P ${{ matrix.profiles }} -Dinclude.quarkus-cli-tests -Dts.quarkus.cli.cmd="${PWD}/quarkus-dev-cli"
      - uses: ./.github/actions/zip-and-archive
        name: Zip and archive artifacts
        if: failure()
        with:
          java: '${{ matrix.java }}'
          os: 'linux'
          profiles: '${{ matrix.profiles }}'
          mode: 'jvm'
  linux-build-jvm-semeru:
    name: Linux JVM Semeru
    runs-on: ubuntu-latest
    needs: build-quarkus
    strategy:
      fail-fast: false
      matrix:
        java: [ 25 ]
        profiles: [ "root-modules", "http-modules,security-modules,spring-modules", "hibernate-modules",
                   "sql-db-modules", "root-modules -pl build/podman/,build/docker -Dtest-ubi8-compatibility",
                   "messaging-modules,websockets-modules,monitoring-modules,cache-modules,test-tooling-modules,nosql-db-modules,ai-modules"]
    steps:
      - uses: actions/checkout@v7
      - name: Reclaim Disk Space
        run: .github/ci-prerequisites.sh
      - name: Install JDK ${{ matrix.java }} Semeru
        uses: actions/setup-java@v6
        with:
          distribution: 'semeru'
          java-version: ${{ matrix.java }}
          check-latest: true
      - uses: ./.github/actions/cache-quarkus
      - uses: ./.github/actions/prepare-quarkus-cli
      - uses: ./.github/actions/use-docker-mirror
      - name: Install Maven settings
        run: cp .github/mvn-settings.xml ~/.m2/settings.xml
      - name: Test in JVM mode
        run: |
          mvn -fae -V -B -nsu --no-transfer-progress clean verify -P ${{ matrix.profiles }} -Dinclude.quarkus-cli-tests -Dts.quarkus.cli.cmd="${PWD}/quarkus-dev-cli"
      - uses: ./.github/actions/zip-and-archive
        name: Zip and archive artifacts
        if: failure()
        with:
          java: '${{ matrix.java }}'
          os: 'linux-semeru'
          profiles: '${{ matrix.profiles }}'
          mode: 'jvm'
  linux-build-native-latest:
    name: Linux Native
    runs-on: ubuntu-latest
    needs: build-quarkus
    strategy:
      fail-fast: false
      matrix:
        java: [ 21 ]
        image: [ "ubi9-quarkus-mandrel-builder-image:jdk-25" ]
        profiles: [ "root-modules,websockets-modules,test-tooling-modules,nosql-db-modules,ai-modules",
                   "http-modules,cache-modules", "security-modules,spring-modules",
                    "hibernate-modules", "sql-db-modules", "messaging-modules,monitoring-modules"]
    steps:
      - uses: actions/checkout@v7
      - name: Reclaim Disk Space
        run: .github/ci-prerequisites.sh
      - name: Install JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          check-latest: true
      - uses: ./.github/actions/cache-quarkus
      - uses: ./.github/actions/prepare-quarkus-cli
      - uses: ./.github/actions/use-docker-mirror
      - name: Install Maven settings
        run: cp .github/mvn-settings.xml ~/.m2/settings.xml
      - name: Test in Native mode
        run: |
          mvn -fae -V -B -nsu --no-transfer-progress -P ${{ matrix.profiles }} clean verify -Dnative \
            -Dquarkus.native.builder-image=quay.io/quarkus/${{ matrix.image }} \
            -Dinclude.quarkus-cli-tests -Dts.quarkus.cli.cmd="${PWD}/quarkus-dev-cli"
      - uses: ./.github/actions/zip-and-archive
        name: Zip and archive artifacts
        if: failure()
        with:
          java: '${{ matrix.java }}'
          os: 'linux'
          profiles: '${{ matrix.profiles }}'
          mode: 'native'
          image: '${{ matrix.image }}'
  windows-build-jvm-latest:
    name: Windows JVM
    runs-on: windows-latest
    needs: build-quarkus
    strategy:
      fail-fast: false
      matrix:
        java: [ 21, 25 ]
    steps:
      - uses: actions/checkout@v7
      - name: Install JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          check-latest: true
      - uses: ./.github/actions/cache-quarkus
      - uses: ./.github/actions/prepare-quarkus-cli-win
      - name: Install Maven settings
        shell: bash
        run: cp .github/mvn-settings.xml ~/.m2/settings.xml
      - name: Build in JVM mode
        shell: bash
        run: |
          mvn -B -nsu --no-transfer-progress -fae clean verify -D"all-modules" -D"include.quarkus-cli-tests" -D"ts.quarkus.cli.cmd=$(pwd)\quarkus-dev-cli.bat" -D"gh-action-disable-on-win"
      - uses: ./.github/actions/zip-and-archive
        name: Zip and archive artifacts
        if: failure()
        with:
          java: '${{ matrix.java }}'
          os: 'windows'
          mode: 'jvm'
  windows-build-native-latest:
    name: Windows Native
    runs-on: windows-latest
    needs: build-quarkus
    strategy:
      fail-fast: false
      matrix:
        java: [ 21 ]
        graalvm-version: [ "mandrel-latest" ]
        graalvm-java-version: [ "25" ]
    steps:
      - uses: actions/checkout@v7
      - name: Install JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          check-latest: true
      - name: Setup GraalVM
        id: setup-graalvm
        uses: graalvm/setup-graalvm@v1
        with:
          version: ${{ matrix.graalvm-version }}
          java-version: ${{ matrix.graalvm-java-version }}
          distribution: 'mandrel'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Pagefile
        # Increased the page-file size due to memory-consumption of native-image command
        # For details see https://github.com/actions/virtual-environments/issues/785
        uses: al-cheb/configure-pagefile-action@v1.5
      - uses: ./.github/actions/cache-quarkus
      - name: Install Maven settings
        shell: bash
        run: cp .github/mvn-settings.xml ~/.m2/settings.xml
      - name: Build in Native mode
        shell: bash
        run: |
          # Running only http/http-minimum as after some time, it gives disk full in Windows when running on Native.
          mvn -B -nsu --no-transfer-progress -fae clean verify -Dall-modules -Dnative -Dquarkus.native.container-build=false -pl http/http-minimum
      - uses: ./.github/actions/zip-and-archive
        name: Zip and archive artifacts
        if: failure()
        with:
          java: '${{ matrix.java }}'
          os: 'windows'
          mode: 'native'
  aarch64-linux-build-jvm-latest:
    name: Linux AArch64 JVM
    runs-on: ubuntu-24.04-arm
    needs: build-quarkus
    strategy:
      fail-fast: false
      matrix:
        java: [ 21, 25 ]
        profiles: [ "root-modules", "http-modules,security-modules,spring-modules", "hibernate-modules",
                    "sql-db-modules", "root-modules -pl build/podman/,build/docker -Dtest-ubi8-compatibility",
                    "messaging-modules,websockets-modules,monitoring-modules,cache-modules,test-tooling-modules,nosql-db-modules,ai-modules"]
    steps:
      - uses: actions/checkout@v7
      - name: Reclaim Disk Space
        run: .github/ci-prerequisites.sh
      - name: Install JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          check-latest: true
      - uses: ./.github/actions/cache-quarkus
      - uses: ./.github/actions/prepare-quarkus-cli
      - uses: ./.github/actions/use-docker-mirror
      - name: Login to Red Hat registry
        uses: docker/login-action@v4.6.0
        with:
          registry: registry.redhat.io
          username: ${{ secrets.RED_HAT_REGISTRY_USERNAME }}
          password: ${{ secrets.RED_HAT_REGISTRY_PASSWORD }}
      - name: Install Maven settings
        run: cp .github/mvn-settings.xml ~/.m2/settings.xml
      - name: Test in JVM mode
        run: |
          mvn -fae -V -B -nsu --no-transfer-progress clean verify -Daarch64 -P ${{ matrix.profiles }} -Dinclude.quarkus-cli-tests -Dts.quarkus.cli.cmd="${PWD}/quarkus-dev-cli"
      - uses: ./.github/actions/zip-and-archive
        name: Zip and archive artifacts
        if: failure()
        with:
          java: '${{ matrix.java }}'
          os: 'linux-aarch64'
          profiles: '${{ matrix.profiles }}'
          mode: 'jvm'
  aarch64-linux-build-native-latest:
    name: Linux AArch64 Native
    runs-on: ubuntu-24.04-arm
    needs: build-quarkus
    strategy:
      fail-fast: false
      matrix:
        java: [ 21 ]
        image: [ "ubi9-quarkus-mandrel-builder-image:jdk-25" ]
        profiles: [ "root-modules,websockets-modules,test-tooling-modules,nosql-db-modules,ai-modules",
                    "http-modules,cache-modules", "security-modules,spring-modules",
                    "hibernate-modules", "sql-db-modules", "messaging-modules,monitoring-modules"]
    steps:
      - uses: actions/checkout@v7
      - name: Reclaim Disk Space
        run: .github/ci-prerequisites.sh
      - name: Install JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          check-latest: true
      - uses: ./.github/actions/cache-quarkus
      - uses: ./.github/actions/prepare-quarkus-cli
      - uses: ./.github/actions/use-docker-mirror
      - name: Login to Red Hat registry
        uses: docker/login-action@v4.6.0
        with:
          registry: registry.redhat.io
          username: ${{ secrets.RED_HAT_REGISTRY_USERNAME }}
          password: ${{ secrets.RED_HAT_REGISTRY_PASSWORD }}
      - name: Install Maven settings
        run: cp .github/mvn-settings.xml ~/.m2/settings.xml
      - name: Test in Native mode
        run: |
          # TODO remove -H:-AOTSingleCallsiteInline workaround once Mandrel ships the fix for https://github.com/quarkusio/quarkus/issues/57390
          mvn -fae -V -B -nsu --no-transfer-progress -P ${{ matrix.profiles }} clean verify -Daarch64 -Dnative \
            -Dquarkus.native.builder-image=quay.io/quarkus/${{ matrix.image }} \
            -Dquarkus.native.additional-build-args-append=-H:-AOTSingleCallsiteInline \
            -Dinclude.quarkus-cli-tests -Dts.quarkus.cli.cmd="${PWD}/quarkus-dev-cli"
      - uses: ./.github/actions/zip-and-archive
        name: Zip and archive artifacts
        if: failure()
        with:
          java: '${{ matrix.java }}'
          os: 'linux-aarch64'
          profiles: '${{ matrix.profiles }}'
          mode: 'native'
