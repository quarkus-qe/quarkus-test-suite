quarkus.langchain4j.openai.api-key=REPLACE_ME

%debug.quarkus.mcp.server.traffic-logging.enabled=true
%debug.quarkus.mcp.server.traffic-logging.text-limit=1000

%openai.quarkus.langchain4j.openai.chat-model.temperature=0
# Recommended to set reasoning to none so the most of the gpt-4-mini features keep similar
# like smaller models are unable to hold the context from the system message
# see https://help.openai.com/en/articles/20001600-migrating-from-gpt-4x-to-gpt-6-luna
%openai.quarkus.langchain4j.openai.chat-model.reasoning-effort=none
%openai.quarkus.langchain4j.openai.chat-model.model-name=gpt-6-luna
%openai.quarkus.langchain4j.openai.log-requests=true

%named.quarkus.langchain4j.openai.custom.chat-model.temperature=0
%named.quarkus.langchain4j.openai.custom.chat-model.model-name=gpt-5.6-luna
%named.quarkus.langchain4j.openai.custom.chat-model.reasoning-effort=none
%named.quarkus.langchain4j.openai.custom.log-requests=true
