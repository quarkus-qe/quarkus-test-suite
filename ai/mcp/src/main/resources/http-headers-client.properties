%debug.quarkus.mcp.server.traffic-logging.enabled=true
%debug.quarkus.mcp.server.traffic-logging.text-limit=1000
# otherwise we run into problems while parsing CLI logs on Windows
quarkus.console.color=false

# MCP clients of HttpHeadersIT, their URLs are set by the test, because the ports are only known at runtime
# the stubs do not implement anything the health check could use, so it is disabled everywhere
quarkus.langchain4j.mcp.headers.transport-type=streamable-http
quarkus.langchain4j.mcp.headers.auto-health-check=false
quarkus.langchain4j.mcp.headers.header.X-Static=static-value

quarkus.langchain4j.mcp.real.transport-type=streamable-http
quarkus.langchain4j.mcp.real.auto-health-check=false

quarkus.langchain4j.mcp.unlisted.transport-type=streamable-http
quarkus.langchain4j.mcp.unlisted.auto-health-check=false
quarkus.langchain4j.mcp.unlisted.tool-execution-timeout=5s

# the trust store path is set by the test, because the server generates it
quarkus.langchain4j.mcp.secure.transport-type=streamable-http
quarkus.langchain4j.mcp.secure.auto-health-check=false
quarkus.langchain4j.mcp.secure.tls-configuration-name=mcp-tls
quarkus.tls.mcp-tls.trust-store.p12.password=password
