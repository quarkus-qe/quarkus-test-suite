%debug.quarkus.mcp.server.traffic-logging.enabled=true
%debug.quarkus.mcp.server.traffic-logging.text-limit=1000
# otherwise we run into problems while parsing CLI logs on Windows
quarkus.console.color=false

# MCP clients of ProtocolAuthIT with named OIDC clients, the URLs of the MCP server and of Keycloak are set by the test,
# because they are only known at runtime
quarkus.langchain4j.mcp.admin.transport-type=streamable-http
quarkus.langchain4j.mcp.admin.auto-health-check=false
quarkus.langchain4j.mcp.admin.oidc-client-name=admin-oidc

quarkus.langchain4j.mcp.user.transport-type=streamable-http
quarkus.langchain4j.mcp.user.auto-health-check=false
quarkus.langchain4j.mcp.user.oidc-client-name=user-oidc

# keycloak tls configuration is provided by getTlsProperties, but uses quarkus.oidc property, while we need oidc-client there
quarkus.oidc-client.admin-oidc.tls.tls-configuration-name=keycloak
quarkus.oidc-client.admin-oidc.client-id=test-application-client
quarkus.oidc-client.admin-oidc.credentials.secret=test-application-client-secret
quarkus.oidc-client.admin-oidc.grant.type=password
quarkus.oidc-client.admin-oidc.grant-options.password.username=test-admin-user
quarkus.oidc-client.admin-oidc.grant-options.password.password=test-admin-user

quarkus.oidc-client.user-oidc.tls.tls-configuration-name=keycloak
quarkus.oidc-client.user-oidc.client-id=test-application-client
quarkus.oidc-client.user-oidc.credentials.secret=test-application-client-secret
quarkus.oidc-client.user-oidc.grant.type=password
quarkus.oidc-client.user-oidc.grant-options.password.username=test-normal-user
quarkus.oidc-client.user-oidc.grant-options.password.password=test-normal-user
