%debug.quarkus.mcp.server.traffic-logging.enabled=true
%debug.quarkus.mcp.server.traffic-logging.text-limit=1000
# otherwise we run into problems while parsing CLI logs on Windows
quarkus.console.color=false

# MCP clients of ProtocolAuthIT without a valid token, their URLs are set by the test, because the port is only known
# at runtime
quarkus.langchain4j.mcp.anonymous.transport-type=streamable-http
quarkus.langchain4j.mcp.anonymous.auto-health-check=false

quarkus.langchain4j.mcp.invalid.transport-type=streamable-http
quarkus.langchain4j.mcp.invalid.auto-health-check=false
quarkus.langchain4j.mcp.invalid.header.Authorization=Bearer invalid
