%debug.quarkus.mcp.server.traffic-logging.enabled=true
%debug.quarkus.mcp.server.traffic-logging.text-limit=1000
# otherwise we run into problems while parsing CLI logs on Windows
quarkus.console.color=false

# MCP clients of HttpProtocolIT, their URLs are set by the test, because the ports are only known at runtime
# the stubs do not implement anything the health check could use, so it is disabled everywhere
quarkus.langchain4j.mcp.modern.transport-type=streamable-http
quarkus.langchain4j.mcp.modern.auto-health-check=false

quarkus.langchain4j.mcp.pinned.transport-type=streamable-http
quarkus.langchain4j.mcp.pinned.auto-health-check=false
quarkus.langchain4j.mcp.pinned.protocol-version=2025-11-25

quarkus.langchain4j.mcp.timeout.transport-type=streamable-http
quarkus.langchain4j.mcp.timeout.auto-health-check=false
quarkus.langchain4j.mcp.timeout.tool-execution-timeout=2s

quarkus.langchain4j.mcp.legacy-timeout.transport-type=streamable-http
quarkus.langchain4j.mcp.legacy-timeout.auto-health-check=false
quarkus.langchain4j.mcp.legacy-timeout.protocol-version=2025-11-25
quarkus.langchain4j.mcp.legacy-timeout.tool-execution-timeout=2s

quarkus.langchain4j.mcp.legacy.transport-type=streamable-http
quarkus.langchain4j.mcp.legacy.auto-health-check=false

quarkus.langchain4j.mcp.silent-discover.transport-type=streamable-http
quarkus.langchain4j.mcp.silent-discover.auto-health-check=false

quarkus.langchain4j.mcp.silent.transport-type=streamable-http
quarkus.langchain4j.mcp.silent.auto-health-check=false

quarkus.langchain4j.mcp.intolerant.transport-type=streamable-http
quarkus.langchain4j.mcp.intolerant.auto-health-check=false

quarkus.langchain4j.mcp.server-error.transport-type=streamable-http
quarkus.langchain4j.mcp.server-error.auto-health-check=false
