%debug.quarkus.mcp.server.traffic-logging.enabled=true
%debug.quarkus.mcp.server.traffic-logging.text-limit=1000
# otherwise we run into problems while parsing CLI logs on Windows
quarkus.console.color=false

quarkus.langchain4j.mcp.filesystem.transport-type=streamable-http
# Remove when https://github.com/quarkiverse/quarkus-langchain4j/issues/2159 is fixed.
quarkus.langchain4j.mcp.filesystem.cache-tool-list=false
