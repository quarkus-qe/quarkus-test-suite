%debug.quarkus.mcp.server.traffic-logging.enabled=true
%debug.quarkus.mcp.server.traffic-logging.text-limit=1000
# otherwise we run into problems while parsing CLI logs on Windows
quarkus.console.color=false

# MCP clients of StdioProtocolIT, their commands are set by the test, because the paths are only known at runtime
quarkus.langchain4j.mcp.modern.transport-type=stdio
quarkus.langchain4j.mcp.modern.auto-health-check=false

quarkus.langchain4j.mcp.static.transport-type=stdio
quarkus.langchain4j.mcp.static.auto-health-check=false
quarkus.langchain4j.mcp.static.subscribe-to-tool-list-changes=false
quarkus.langchain4j.mcp.static.subscribe-to-prompt-list-changes=false
quarkus.langchain4j.mcp.static.subscribe-to-resource-list-changes=false

quarkus.langchain4j.mcp.pinned.transport-type=stdio
quarkus.langchain4j.mcp.pinned.auto-health-check=false
quarkus.langchain4j.mcp.pinned.protocol-version=2025-11-25
