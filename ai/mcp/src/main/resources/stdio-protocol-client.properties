%debug.quarkus.mcp.server.traffic-logging.enabled=true
%debug.quarkus.mcp.server.traffic-logging.text-limit=1000
# otherwise we run into problems while parsing CLI logs on Windows
quarkus.console.color=false

# MCP clients of StdioProtocolIT, their commands are set by the test, because the paths are only known at runtime
# the stubs do not implement anything the health check could use, so it is disabled everywhere
quarkus.langchain4j.mcp.modern.transport-type=stdio
quarkus.langchain4j.mcp.modern.auto-health-check=false

quarkus.langchain4j.mcp.static.transport-type=stdio
quarkus.langchain4j.mcp.static.auto-health-check=false
quarkus.langchain4j.mcp.static.subscribe-to-tool-list-changes=false
quarkus.langchain4j.mcp.static.subscribe-to-prompt-list-changes=false
quarkus.langchain4j.mcp.static.subscribe-to-resource-list-changes=false

quarkus.langchain4j.mcp.timeout.transport-type=stdio
quarkus.langchain4j.mcp.timeout.auto-health-check=false
quarkus.langchain4j.mcp.timeout.tool-execution-timeout=2s

quarkus.langchain4j.mcp.legacy-timeout.transport-type=stdio
quarkus.langchain4j.mcp.legacy-timeout.auto-health-check=false
quarkus.langchain4j.mcp.legacy-timeout.protocol-version=2025-11-25
quarkus.langchain4j.mcp.legacy-timeout.tool-execution-timeout=2s

quarkus.langchain4j.mcp.pinned.transport-type=stdio
quarkus.langchain4j.mcp.pinned.auto-health-check=false
quarkus.langchain4j.mcp.pinned.protocol-version=2025-11-25

quarkus.langchain4j.mcp.legacy.transport-type=stdio
quarkus.langchain4j.mcp.legacy.auto-health-check=false

quarkus.langchain4j.mcp.intolerant.transport-type=stdio
quarkus.langchain4j.mcp.intolerant.auto-health-check=false

quarkus.langchain4j.mcp.intolerant-restart.transport-type=stdio
quarkus.langchain4j.mcp.intolerant-restart.auto-health-check=false

quarkus.langchain4j.mcp.intolerant-pinned.transport-type=stdio
quarkus.langchain4j.mcp.intolerant-pinned.auto-health-check=false
quarkus.langchain4j.mcp.intolerant-pinned.protocol-version=2025-11-25
