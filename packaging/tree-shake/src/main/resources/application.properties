# Data source + Hibernate ORM (H2 in-memory, prod mode has no dev services)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:tree-shake;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# JWT signing and verification
smallrye.jwt.sign.key.location=private-key.pem
mp.jwt.verify.publickey.location=public-key.pem
mp.jwt.verify.issuer=https://my.auth.server/

# OpenAPI
quarkus.smallrye-openapi.info-title=Tree Shake API

# Keep the PEM keys available when building a native image
quarkus.native.additional-build-args=-H:IncludeResources=.*\\.pem
